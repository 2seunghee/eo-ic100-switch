; usbhs-logmitm (EO-IC100 접근 C) 설정. 바꾼 뒤에는 재부팅해야 적용된다.
; 평소 사용 설정이다. 문제를 기록해야 할 때만 read_ctrl_data=1, sync=1로 바꾼다.
[usbhslog]
; 0이면 아무것도 가로채지 않는다(프로세스만 떠 있음).
enabled=1
; 접근 C: audio가 받는 EO-IC100 디스크립터를 고쳐 쓸 규칙(쉼표로 여러 개). none이면 기록만 한다.
;   terminal      = ot_headphones + it_mic (H2: 단자 종류 0x0402 Headset -> 0x0302 Headphones / 0x0201 Microphone)
;   single_rate   = 재생 샘플레이트 목록을 48000만 남김(H3)
;   alt1_only     = 24/32비트 재생 모드(alt 2, 3)를 숨김
;   mps48         = isoc 엔드포인트 최대 패킷 크기를 48 kHz 기준으로
rewrite=terminal
; 가로챌 서비스. usb:hs:a는 오디오가 usb:hs를 안 쓰는 것으로 확인될 때만 추가한다.
services=usb:hs
; 가로챌 프로그램: audio, hid, homebrew(hbmenu로 띄운 NRO), all, 또는 16자리 프로그램 ID
programs=audio
; 컨트롤 전송의 데이터(디스크립터 응답, SET_CUR 값)를 클라이언트 메모리에서 읽어 기록한다.
read_ctrl_data=0
; 줄마다 SD에 기록한 뒤 요청을 넘긴다(콘솔이 재부팅돼도 마지막 줄이 남는다).
sync=0
; 초당 수백 번 오는 요청(isoc 전송, 프레임 번호)은 세션마다 처음 이만큼만 자세히 남기고 이후 5초마다 개수만 남긴다.
hot_detail=40
; IPC 버퍼를 16진수로 남길 최대 바이트 수
buf_dump=64
; 남겨 둘 로그 파일 수
log_keep=20
