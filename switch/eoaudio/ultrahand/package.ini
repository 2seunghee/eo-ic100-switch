;title='eoaudio'
;version=0.5.0
;creator='eoaudio'
;about='EO-IC100 USB-C 이어폰 설정. 바꾸면 2초 안에 바로 적용된다.'

[eoaudio 켜기]
;mode=toggle?on
on:
set-ini-val /switch/eoaudio/config.ini eoaudio enabled 1
off:
set-ini-val /switch/eoaudio/config.ini eoaudio enabled 0

[*스피커 끄기]
;mode=option
list_source '(auto, master0, mute, volume0, off)'
set-ini-val /switch/eoaudio/config.ini eoaudio speaker_mute {list_source(*)}

[*가운데 버튼]
;mode=option
list_source '(media, mute, none)'
set-ini-val /switch/eoaudio/config.ini eoaudio play_button {list_source(*)}

[*미디어 앱에서 누를 버튼]
;mode=option
list_source '(a, b, x, y, l, r, zl, zr, plus, minus)'
set-ini-val /switch/eoaudio/config.ini eoaudio media_button {list_source(*)}

[현재 앱을 미디어 앱으로]
set-ini-val /switch/eoaudio/config.ini eoaudio media_apps {title_id}

[YouTube만 미디어 앱으로]
set-ini-val /switch/eoaudio/config.ini eoaudio media_apps 01003A400C3DA000

[볼륨 표시창]
;mode=toggle?on
on:
set-ini-val /switch/eoaudio/config.ini eoaudio volume_osd 1
off:
set-ini-val /switch/eoaudio/config.ini eoaudio volume_osd 0

[*볼륨 한 칸(dB)]
;mode=option
list_source '(1, 2, 3, 4, 6)'
set-ini-val /switch/eoaudio/config.ini eoaudio volume_step_db {list_source(*)}

[*최대 볼륨(dB)]
;mode=option
list_source '(0, -3, -6, -10, -15, -20)'
set-ini-val /switch/eoaudio/config.ini eoaudio volume_max_db {list_source(*)}

[콘솔 볼륨에 묶기]
;mode=toggle?off
on:
set-ini-val /switch/eoaudio/config.ini eoaudio volume_follow 1
off:
set-ini-val /switch/eoaudio/config.ini eoaudio volume_follow 0

[*로그 수준]
;mode=option
list_source '(info, debug)'
set-ini-val /switch/eoaudio/config.ini eoaudio log_level {list_source(*)}
